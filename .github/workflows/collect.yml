name: Collect ticker mentions

on:
  workflow_dispatch: {}   # manual only — no schedule, so no automatic spend

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LOOKBACK_HOURS: "12"
        run: python collector.py

      - name: Commit updated data
        run: |
          git config user.name "ticker-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update mention data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
